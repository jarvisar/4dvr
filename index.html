<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101318" />
    <title>4D VR | 4D Shapes, Polytopes & Non-Euclidean Space in WebXR</title>
    <meta name="description" content="WebXR app for exploring 4D shapes in VR or a desktop browser. Includes a 4D physics sandbox, the regular 4-polytopes, knots, the Hopf fibration, hyperbolic and spherical space, and a Klein bottle room. Works on Meta Quest with hand tracking." />
    <link rel="canonical" href="https://4dvr.jarvisar.com/" />
    <!-- Social previews need absolute URLs, so these don't use the relative base -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="4D VR" />
    <meta property="og:title" content="4D VR" />
    <meta property="og:description" content="Explore 4D shapes, hyperbolic space, and spherical space in VR or a desktop browser." />
    <meta property="og:url" content="https://4dvr.jarvisar.com/" />
    <meta property="og:image" content="https://4dvr.jarvisar.com/og-image.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:alt" content="4D objects on a table shown as 3D cross-sections" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "4D VR",
        "url": "https://4dvr.jarvisar.com/",
        "description": "WebXR app for exploring 4D shapes, hyperbolic space, and spherical space in VR or a desktop browser.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any (WebXR browser for VR)",
        "image": "https://4dvr.jarvisar.com/og-image.jpg",
        "offers": { "@type": "Offer", "price": "0" },
        "author": { "@type": "Person", "name": "Jarvizar" }
      }
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='12' fill='%231b1f26' stroke='%23e6e8ec' stroke-width='4'/%3E%3Cpath d='M32 16V48M24 24H40M24 40H40' stroke='%23e6e8ec' stroke-width='4'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="overlay">
      <main class="console">
        <h1 class="wordmark">4D VR</h1>
        <p class="lede">
          View and interact with 4D objects, higher-dimensional geometry, and hyperbolic and spherical space.
          4D objects are shown as 3D cross-sections, and you can move the cross-section along
          the fourth axis, w.
        </p>

        <ol class="index" id="scene-index">
          <li><button data-scene="playground"><span class="n">1</span><b>Hyperplay</b><span class="d">4D physics sandbox</span></button></li>
          <li><button data-scene="gallery"><span class="n">2</span><b>Polytope Lab</b><span class="d">Regular 4-polytopes, projected and sliced</span></button></li>
          <li><button data-scene="knots"><span class="n">3</span><b>Knot Lab</b><span class="d">Untie knots by moving strands through w</span></button></li>
          <li><button data-scene="hopf"><span class="n">4</span><b>Hopf Garden</b><span class="d">The Hopf fibration of the 3-sphere</span></button></li>
          <li><button data-scene="hyperbolic"><span class="n">5</span><b>Hyperbolic Space</b><span class="d">The {5,3,4} and {4,3,5} honeycombs</span></button></li>
          <li><button data-scene="spherical"><span class="n">6</span><b>Spherical Space</b><span class="d">Walk inside the 120-cell on the 3-sphere</span></button></li>
          <li><button data-scene="klein"><span class="n">7</span><b>Klein Room</b><span class="d">Walk through a wall and come back mirrored</span></button></li>
          <li><button data-scene="quasicrystal"><span class="n">8</span><b>Quasicrystals</b><span class="d">Penrose tilings as slices of 5D and 6D lattices</span></button></li>
        </ol>

        <div class="actions" id="actions">
          <button id="enter-vr" class="btn primary" disabled>Enter VR</button>
          <button id="enter-desktop" class="btn">Desktop mode</button>
        </div>
        <p class="status pending" id="xr-status"><i></i><span id="xr-note">Checking for a headset</span></p>
        <p class="keys"><kbd>1</kbd>–<kbd>8</kbd> scenes <kbd>M</kbd> menu <kbd>H</kbd> help</p>
      </main>
    </div>

    <div id="hud" hidden>
      <div class="hud-top">
        <nav id="scene-tabs" aria-label="Scenes"></nav>
        <div class="hud-tools">
          <button id="hud-menu" class="btn small" title="Menu (M)" aria-pressed="false">Menu <kbd>M</kbd></button>
          <button id="hud-help-toggle" class="btn small" title="Controls (H)" aria-pressed="false" aria-controls="hud-help">Help <kbd>H</kbd></button>
        </div>
      </div>
      <section id="hud-help" aria-label="Controls">
        <header>Controls</header>
        <ul id="hud-help-list"></ul>
      </section>
      <div id="hud-stats" hidden></div>
      <button id="hud-vr" class="btn primary small" hidden>Enter VR</button>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
