<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080c" />
    <title>4D VR</title>
    <meta name="description" content="WebXR app for viewing and interacting with 4D objects, higher-dimensional geometry, and hyperbolic and spherical space." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M14 4H60V50L50 60H4V14Z' fill='%2307080c' stroke='%23eceef4' stroke-width='4'/%3E%3Cpath d='M4 14L14 4' stroke='%2333c3ff' stroke-width='5'/%3E%3Cpath d='M60 50L50 60' stroke='%23ff4f9a' stroke-width='5'/%3E%3Cpath d='M32 16V48M24 24H40M24 40H40' stroke='%23eceef4' stroke-width='4'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="overlay">
      <main class="console">
        <h1 class="wordmark">4D VR</h1>
        <p class="lede">
          View and interact with 4D objects, higher-dimensional geometry, and hyperbolic and spherical space.
          4D objects are shown as 3D cross-sections, and you can move the cross-section along
          the fourth axis, w.
        </p>

        <ol class="index" id="scene-index">
          <li><button data-scene="playground"><span class="n">1</span><b>Hyperplay</b><span class="d">4D physics sandbox</span></button></li>
          <li><button data-scene="flatland"><span class="n">2</span><b>Flatland</b><span class="d">Poke your hand through a 2D world</span></button></li>
          <li><button data-scene="gallery"><span class="n">3</span><b>Polytope Lab</b><span class="d">Regular 4-polytopes, projected and sliced</span></button></li>
          <li><button data-scene="knots"><span class="n">4</span><b>Knot Lab</b><span class="d">Untie knots by moving strands through w</span></button></li>
          <li><button data-scene="hopf"><span class="n">5</span><b>Hopf Garden</b><span class="d">The Hopf fibration of the 3-sphere</span></button></li>
          <li><button data-scene="hyperbolic"><span class="n">6</span><b>Hyperbolic Space</b><span class="d">The {5,3,4} and {4,3,5} honeycombs</span></button></li>
          <li><button data-scene="spherical"><span class="n">7</span><b>Spherical Space</b><span class="d">Walk inside the 120-cell on the 3-sphere</span></button></li>
          <li><button data-scene="klein"><span class="n">8</span><b>Klein Room</b><span class="d">Walk through a wall and come back mirrored</span></button></li>
          <li><button data-scene="quasicrystal"><span class="n">9</span><b>Quasicrystals</b><span class="d">Penrose tilings as slices of 5D and 6D lattices</span></button></li>
        </ol>

        <div class="actions" id="actions">
          <button id="enter-vr" class="btn primary" disabled>Enter VR</button>
          <button id="enter-desktop" class="btn">Desktop mode</button>
        </div>
        <p class="status pending" id="xr-status"><i></i><span id="xr-note">Checking for a headset</span></p>
        <p class="keys"><kbd>1</kbd>–<kbd>9</kbd> scenes <kbd>M</kbd> menu <kbd>H</kbd> help</p>
      </main>
    </div>

    <div id="hud" hidden>
      <div class="hud-top">
        <nav id="scene-tabs" aria-label="Scenes"></nav>
        <div class="hud-tools">
          <button id="hud-menu" class="btn small" title="Menu (M)" aria-pressed="false">Menu <kbd>M</kbd></button>
          <button id="hud-help-toggle" class="btn small" title="Controls (H)" aria-pressed="false" aria-controls="hud-help">Help <kbd>H</kbd></button>
        </div>
      </div>
      <section id="hud-help" aria-label="Controls">
        <header>Controls</header>
        <ul id="hud-help-list"></ul>
      </section>
      <div id="hud-stats" hidden></div>
      <button id="hud-vr" class="btn primary small" hidden>Enter VR</button>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
